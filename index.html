<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Voter Project</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fdfaf5;
    --ink: #1a1a1a;
    --accent: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  .wrap {
    max-width: 640px;
    text-align: center;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.15;
    margin: 0 0 1.25rem;
  }
  p {
    font-size: 1.1rem;
    line-height: 1.6;
    color: #444;
    margin: 0 0 0.5rem;
  }
  .tag {
    margin-top: 2rem;
    font-size: 1rem;
    font-style: italic;
    color: #666;
    border-top: 1px solid #e2ddd2;
    padding-top: 1.5rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Texas Voter Project</div>
    <h1>Our new site is on the way.</h1>
    <p>We're rebuilding texasvoterproject.org from the ground up.</p>
    <p>Check back soon.</p>
    <p class="tag">"If we want higher participation, we have to build communities people actually want to participate in."</p>
  </div>
</body>
</html>
